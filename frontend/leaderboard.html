<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboard | Skill Forge</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: radial-gradient(circle at top left, #1a1025, #0a0a0d); background-color: #0a0a0d; padding-bottom: 80px; }
        .top-brand { text-align: center; padding: 20px 0; font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: #8c71ff; text-transform: uppercase; }
        
        /* Layout formatting specific mapping */
        .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 15px; margin: 40px 0; }
        .podium-col { display: flex; flex-direction: column; align-items: center; width: 105px; }
        .rank-1 .podium-step { height: 190px; }
        .rank-2 .podium-step { height: 140px; }
        .rank-3 .podium-step { height: 110px; }

        .avatar-circle {
            width: 70px; height: 70px; border-radius: 50%; background: #15151a; display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: -35px; z-index: 2; border: 3px solid; box-sizing: border-box;
        }
        .avatar-circle.gold { border-color: #facc15; box-shadow: 0 0 20px rgba(250, 204, 21, 0.4); }
        .avatar-circle.silver { border-color: #94a3b8; }
        .avatar-circle.bronze { border-color: #ea580c; }

        .podium-step {
            width: 100%; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            padding-top: 45px; position: relative; border-top: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05);
        }
        .gold-bg { background: linear-gradient(180deg, rgba(161, 134, 18, 0.5) 0%, rgba(20,20,30,0.4) 100%); }
        .silver-bg { background: linear-gradient(180deg, rgba(82, 92, 106, 0.4) 0%, rgba(20,20,30,0.4) 100%); }
        .bronze-bg { background: linear-gradient(180deg, rgba(146, 60, 24, 0.4) 0%, rgba(20,20,30,0.4) 100%); }

        .rank-num { font-size: 2.2rem; font-weight: 900; margin: 0 0 5px 0; color: #fff; line-height:1;}
        .p-name { font-size: 0.9rem; font-weight: 700; color: #e2e8f0; text-align: center; max-width: 90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
        .p-score { font-size: 0.9rem; font-weight: 800; color: #a855f7; margin-top: auto; margin-bottom: 20px;}
        .trophy { font-size: 2.2rem; margin-bottom: -5px; text-shadow: 0 0 20px rgba(250, 204, 21, 0.8); z-index: 3;}

        .leaderboard-list { max-width: 600px; margin: 0 auto; padding: 0 20px;}
        .leaderboard-item { background: #1c1c24; margin-bottom: 15px; padding: 20px; border-radius: 15px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05); color:#fff; }
        
        .badge-list { font-size: 0.8rem; opacity: 0.8; margin-top: 5px; }
    </style>
</head>
<body class="mobile-app">
    
    <div class="top-brand">SKILLFORGE</div>

    <div class="container" style="padding-top:10px;">
        <div style="text-align:center; margin-bottom:30px;">
            <h1 style="color:#facc15; font-size:3rem; font-weight:900; margin:0; text-shadow:0 2px 10px rgba(250, 204, 21, 0.2);">Hall of Fame</h1>
            <p style="color:#94a3b8; font-size:1.1rem; font-weight:600; margin-top:10px;">The top coders globally</p>
        </div>

        <div class="podium-container" id="podium-container">
            <!-- Podium injected by js -->
        </div>

        <div class="leaderboard-list" id="leaderboard-container">
            <!-- Remainder list injected by js -->
        </div>
    </div>

    <div class="bottom-nav" style="position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 15, 19, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 15px 0 20px 0; z-index:1000;">
        <a href="/dashboard.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; font-weight: 700; font-size: 0.8rem;">
            <span style="font-size: 1.5rem;">🏠</span><span>Home</span>
        </a>
        <a href="/topics.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; font-weight: 700; font-size: 0.8rem;">
            <span style="font-size: 1.5rem;">📖</span><span>Topics</span>
        </a>
        <a href="/leaderboard.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #a855f7; font-weight: 700; font-size: 0.8rem;">
            <span style="font-size: 1.5rem; text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);">🏆</span><span>Rank</span>
        </a>
        <a href="/profile.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; font-weight: 700; font-size: 0.8rem;">
            <span style="font-size: 1.5rem;">👤</span><span>Profile</span>
        </a>
    </div>

    <script src="js/api.js"></script>
    <script>
        checkAuth();

        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.substring(0, 2).toUpperCase();
        }

        function buildPodiumCol(u, rankNum, colorClass) {
            const displayName = u.displayName || u.username.split('@')[0];
            const initials = getInitials(displayName);
            const trophyHtml = rankNum === 1 ? `<div class="trophy">🏅</div>` : '';
            return `
            <div class="podium-col rank-${rankNum} pop-anim" style="animation-delay: ${rankNum * 0.1}s">
                ${trophyHtml}
                <div class="avatar-circle ${colorClass}">${initials}</div>
                <div class="podium-step ${colorClass}-bg">
                    <h2 class="rank-num">${rankNum}</h2>
                    <div class="p-name">${displayName}</div>
                    <div class="p-score">${u.score} XP</div>
                </div>
            </div>
            `;
        }

        async function loadLeaderboard() {
            try {
                const user = getUser();
                const users = await apiCall('/leaderboard');
                
                const podiumContainer = document.getElementById('podium-container');
                const listContainer = document.getElementById('leaderboard-container');
                podiumContainer.innerHTML = '';
                listContainer.innerHTML = '';
                
                // Podium mappings: Top 3 logic mapped cleanly prioritizing visually Rank 1 strictly as center.
                let podiumHTML = '';
                if (users[1]) podiumHTML += buildPodiumCol(users[1], 2, 'silver');
                if (users[0]) podiumHTML += buildPodiumCol(users[0], 1, 'gold');
                if (users[2]) podiumHTML += buildPodiumCol(users[2], 3, 'bronze');
                
                podiumContainer.innerHTML = podiumHTML;
                
                // Loop the remaining fallback natively.
                const remaining = users.slice(3);
                remaining.forEach((u, idx) => {
                    const absRank = idx + 4;
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item pop-anim';
                    item.style.animationDelay = `${idx * 0.1}s`;

                    if (u.username === user.username) {
                        item.style.background = 'rgba(255, 255, 255, 0.15)';
                    }

                    const displayName = u.displayName || u.username.split('@')[0];
                    const badgesLength = u.badges ? u.badges.length : 0;
                    
                    item.innerHTML = `
                        <div style="display:flex; align-items:center; gap:20px;">
                            <span style="min-width:40px; font-weight:900; font-size:1.5rem; color:#888;">#${absRank}</span>
                            <div>
                                <div style="font-weight:800; font-size:1.1rem;">${displayName}</div>
                                <div class="badge-list" style="color:#a855f7;">${badgesLength} Badges Earned</div>
                            </div>
                        </div>
                        <div style="font-weight:900; font-size:1.2rem;">🌟 ${u.score} XP</div>
                    `;
                    listContainer.appendChild(item);
                });
            } catch (e) {
                console.error(e);
                alert('Failed to load leaderboard structure.');
            }
        }
        document.addEventListener('DOMContentLoaded', loadLeaderboard);
    </script>
</body>
</html>
