<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Skill Forge</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #1a1025, #0a0a0d); 
            background-color: #0a0a0d;
            padding-bottom: 80px; 
        }
        .top-brand { text-align: center; padding: 20px 0; font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: #8c71ff; text-transform: uppercase; }
        .greet-section { padding: 0 20px; }
        .greet-section p { color: #a0a0a0; font-size: 1.1rem; margin-bottom: 5px; font-weight:500; }
        .greet-section h1 { font-size: 2.5rem; font-weight: 900; color: #fff; }
        
        .rank-card { background: linear-gradient(145deg, #2a1b38, #1c1c24); border-radius: 20px; margin: 25px 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        .rank-card .header { font-size: 0.9rem; color: #a855f7; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
        .rank-card .stats-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
        .rank-card .level-val { font-size: 3.5rem; font-weight: 900; line-height: 1; color:#fff;}
        .rank-card .level-lbl { font-size: 1.2rem; color: #a0a0a0; font-weight: 700; }
        .rank-card .xp-val { font-size: 1.8rem; font-weight: 800; line-height: 1; color:#fff;}
        .rank-card .xp-lbl { font-size: 1rem; color: #a0a0a0; font-weight: 700; }
        .progress-track { height: 12px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #a855f7); width: 0%; border-radius: 10px; transition: 1s ease; }
        .xp-to-next { text-align: right; font-size: 0.9rem; color: #888; font-weight: 700; }
        
        .quick-stats { display: flex; gap: 15px; padding: 0 20px; margin-bottom: 25px; }
        .stat-box { flex: 1; background: #15151a; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); padding: 20px 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .stat-box .icon { font-size: 1.8rem; margin-bottom: 10px; display: block; filter: saturate(1.5);}
        .stat-box .val { font-size: 1.5rem; font-weight: 800; color:#fff;}
        .stat-box .lbl { font-size: 0.7rem; color: #888; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        
        .reward-card { background: #1a1a20; border-radius: 15px; margin: 0 20px; padding: 20px; display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; }
        .reward-card:active { transform: scale(0.98); }
        .reward-card.claimed { opacity: 0.5; cursor: default; }
        .reward-icon { width: 50px; height: 50px; background: rgba(255,255,255,0.05); border-radius: 12px; display: flex; justify-content:center; align-items:center; font-size: 1.5rem; }
        .reward-text h4 { font-size: 1.2rem; font-weight: 800; color:#fff;}
        .reward-text p { font-size: 0.9rem; color: #888; font-weight: 700; gap:5px; margin-top:3px;}
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 15, 19, 0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 15px 0 20px 0; z-index:1000;}
        .nav-item { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; font-weight: 700; font-size: 0.8rem; transition: 0.2s; }
        .nav-item.active { color: #a855f7; }
        .nav-item .icon { font-size: 1.5rem; }

        /* Path overrides */
        #missions-path::before { display: none !important; }
        #missions-path .mission-node { transform: none !important; width: 100%; max-width: 330px; box-sizing: border-box; }
        #missions-path .mission-node:hover { transform: scale(1.03) !important; }
        #missions-path .mission-node:active { transform: scale(0.98) !important; }
    </style>
</head>
<body class="mobile-app">
    
    <div class="top-brand">SKILLFORGE</div>
    
    <div class="greet-section">
        <div style="font-size:1.1rem; color:#a0a0a0; font-weight:900; text-transform:uppercase; letter-spacing:3px; margin-bottom:5px;">Welcome</div>
        <p id="time-greeting">Good Evening,</p>
        <h1><span id="dash-username">User</span> 👋</h1>
    </div>

    <div class="rank-card pop-anim">
        <div class="header">CURRENT RANK</div>
        <div class="stats-row">
            <div><span class="level-val" id="dash-level">1</span> <span class="level-lbl">Lvl</span></div>
            <div><span class="xp-val" id="dash-xp">0</span> <span class="xp-lbl">XP</span></div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="dash-prog-fill"></div>
        </div>
        <div class="xp-to-next" id="dash-prog-text">100 XP to next level</div>
    </div>

    <div class="quick-stats pop-anim" style="animation-delay: 0.1s;">
        <div class="stat-box">
            <span class="icon">🔥</span>
            <div class="val" id="stat-streak">1</div>
            <div class="lbl">DAY STREAK</div>
        </div>
        <div class="stat-box">
            <span class="icon">🏅</span>
            <div class="val" id="stat-badges">0</div>
            <div class="lbl">BADGES</div>
        </div>
        <div class="stat-box">
            <span class="icon">📖</span>
            <div class="val" id="stat-topics">0</div>
            <div class="lbl">TOPICS DONE</div>
        </div>
    </div>

    <div class="reward-card pop-anim" id="reward-btn" style="animation-delay: 0.2s;">
        <div class="reward-icon">🎁</div>
        <div class="reward-text">
            <h4 id="reward-title">Claim Daily Reward</h4>
            <p id="reward-subtitle">+20 XP Drop available!</p>
        </div>
    </div>

    <div class="container" style="padding-top:20px; margin-bottom:40px;">
        <h2 style="text-align: center; margin-bottom:30px; font-size:2rem; text-shadow:0 0 10px rgba(255,255,255,0.2);">Journey</h2>
        <div class="level-path" id="missions-path">
            <!-- Unified Map Populated directly down here! -->
        </div>
    </div>

    <div class="bottom-nav">
        <a href="/dashboard.html" class="nav-item active">
            <span class="icon">🏠</span><span>Home</span>
        </a>
        <a href="/topics.html" class="nav-item">
            <span class="icon">📖</span><span>Topics</span>
        </a>
        <a href="/leaderboard.html" class="nav-item">
            <span class="icon">🏆</span><span>Rank</span>
        </a>
        <a href="/profile.html" class="nav-item">
            <span class="icon">👤</span><span>Profile</span>
        </a>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
