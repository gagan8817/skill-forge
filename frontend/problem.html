<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge | Skill Forge</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .progress-container { width: 100%; height: 15px; background: rgba(255,255,255,0.2); border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 2px solid rgba(255,255,255,0.4); }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s ease; border-radius: 10px; }
    </style>
</head>
<body>
    <nav>
        <h1><a href="/dashboard.html">Skill Forge</a></h1>
        <div class="nav-links">
            <a href="#" onclick="goBack(); return false;" class="btn btn-outline" style="border:none;">Exit</a>
            <a href="/dashboard.html" class="btn btn-outline" style="border:none;">Home</a>
            <a href="/leaderboard.html" class="btn btn-outline" style="border:none;">Leaderboard</a>
            <a href="/profile.html" class="btn btn-outline" style="border:none;">Profile</a>
            <span style="margin-left:15px;">🌟 <span id="user-score">0</span></span>
        </div>
    </nav>

    <div class="container pop-anim">
        <div class="glass-panel quiz-container">
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            
            <div class="quiz-header">
                <h2 id="problem-title">Loading Challenge...</h2>
            </div>
            
            <div class="quiz-question" id="problem-description"></div>

            <div class="options-grid" id="options-container"></div>

            <div class="quiz-footer">
                <div id="status-msg"></div>
                <button class="btn btn-secondary" id="check-btn" disabled>CHECK</button>
            </div>
        </div>
    </div>

    <!-- Full Screen Congratulations Overlay -->
    <div class="full-screen-overlay" id="full-screen-overlay">
        <h1>CONGRATULATIONS!</h1>
        <div class="badge-reward" id="badge-reward">🏆</div>
        <h2 id="congrats-text">You have completed a level!</h2>
        <h3 id="floating-xp" style="margin-bottom:40px; color:var(--gold);">New Rank Unlocked!</h3>
        <button class="btn btn-warning" style="font-size:1.5rem;" id="continue-overlay-btn">CONTINUE</button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/problem.js"></script>
</body>
</html>
